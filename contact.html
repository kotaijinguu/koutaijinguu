<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ｜皇太神宮（北方皇太神宮）</title>
<meta name="description" content="皇太神宮へのお問い合わせ。御祈願・出張祭典・その他ご相談はお電話またはフォームよりお気軽にお問い合わせください。">
<link rel="icon" type="image/png" href="images/kitagata-logo-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <img src="images/kitagatakoutaijingu.png" alt="皇太神宮" loading="lazy">
    </a>
    <button class="hamburger" id="hamburgerBtn" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="about.html">御由緒</a></li>
        <li><a href="prayers.html">御祈願</a></li>
        <li><a href="access.html">アクセス</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>

  <section class="hero hero-page" style="background-image:url('images/2025-10-31_09-02-14_264.jpg');">
    <div class="hero-inner">
      <span class="hero-en">CONTACT</span>
      <h1 class="hero-title">お問い合わせ</h1>
    </div>
  </section>

  <section>
    <div class="container">
      <p class="contact-tel">
        お電話でのお問い合わせ<br>
        <span>TEL：045-622-1773</span>
      </p>

      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST" id="contactForm">
        <input type="hidden" name="access_key" value="40bcf35d-2cf9-45c8-94b3-1b3bf0b67481">
        <input type="checkbox" name="botcheck" style="display:none">

        <div class="form-group">
          <label for="name">お名前<span class="required">必須</span></label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="kana">ふりがな</label>
          <input type="text" id="kana" name="kana">
        </div>

        <div class="form-group">
          <label for="email">メールアドレス<span class="required">必須</span></label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="tel">電話番号</label>
          <input type="tel" id="tel" name="tel">
        </div>

        <div class="form-group">
          <label for="type">お問い合わせ種別<span class="required">必須</span></label>
          <select id="type" name="type" required>
            <option value="">選択してください</option>
            <option value="prayer">御祈願について</option>
            <option value="ceremony">出張祭典について</option>
            <option value="reservation">ご祈祷のご予約</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">お問い合わせ内容<span class="required">必須</span></label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <div class="form-submit">
          <button type="submit">送信する</button>
        </div>

        <p class="form-message" id="formMessage" hidden></p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p class="footer-name">皇太神宮</p>
  <p>〒231-0844 神奈川県横浜市中区西之谷町73</p>
  <p>TEL：045-622-1773</p>
  <p class="footer-links"><a href="privacy.html">プライバシーポリシー</a></p>
  <p class="footer-copyright">&copy; <span id="year"></span> 皇太神宮 All Rights Reserved.</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
